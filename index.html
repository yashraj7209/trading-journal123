<!DOCTYPE html>
<html>
<head>
  <title>Forex Trading Journal Pro</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    input, select {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 15px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }

    button:hover {
      background: #16a34a;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      width: 23%;
      text-align: center;
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #1f2937;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #1f2937;
    }

    .win { color: #22c55e; }
    .loss { color: #ef4444; }
  </style>
</head>

<body>

<div class="container">

<h1>📊 Forex Trading Journal</h1>

<!-- INPUT FORM -->
<div>
  <input id="pair" placeholder="Pair (EURUSD)">
  <select id="type">
    <option>Buy</option>
    <option>Sell</option>
  </select>
  <input id="entry" placeholder="Entry">
  <input id="exit" placeholder="Exit">
  <input id="lot" placeholder="Lot Size">
  <button onclick="addTrade()">Add Trade</button>
</div>

<!-- STATS -->
<div class="stats">
  <div class="card">Total Trades <div id="total">0</div></div>
  <div class="card">Wins <div id="wins">0</div></div>
  <div class="card">Losses <div id="losses">0</div></div>
  <div class="card">Win Rate <div id="winrate">0%</div></div>
</div>

<!-- TABLE -->
<table>
  <thead>
    <tr>
      <th>Pair</th>
      <th>Type</th>
      <th>Entry</th>
      <th>Exit</th>
      <th>Lot</th>
      <th>P&L</th>
      <th>Result</th>
    </tr>
  </thead>
  <tbody id="trades"></tbody>
</table>

</div>

<script>
let trades = [];

function addTrade() {
  let pair = document.getElementById("pair").value;
  let type = document.getElementById("type").value;
  let entry = parseFloat(document.getElementById("entry").value);
  let exit = parseFloat(document.getElementById("exit").value);
  let lot = parseFloat(document.getElementById("lot").value);

  if (!pair || !entry || !exit || !lot) return alert("Fill all fields");

  let pnl = (type === "Buy")
    ? (exit - entry) * lot * 100
    : (entry - exit) * lot * 100;

  let result = pnl >= 0 ? "Win" : "Loss";

  trades.push({ pair, type, entry, exit, lot, pnl, result });

  updateTable();
  updateStats();
}

function updateTable() {
  let table = document.getElementById("trades");
  table.innerHTML = "";

  trades.forEach(t => {
    table.innerHTML += `
      <tr>
        <td>${t.pair}</td>
        <td>${t.type}</td>
        <td>${t.entry}</td>
        <td>${t.exit}</td>
        <td>${t.lot}</td>
        <td class="${t.pnl >= 0 ? 'win' : 'loss'}">${t.pnl.toFixed(2)}</td>
        <td>${t.result}</td>
      </tr>
    `;
  });
}

function updateStats() {
  let total = trades.length;
  let wins = trades.filter(t => t.pnl >= 0).length;
  let losses = total - wins;
  let winrate = total ? (wins / total * 100).toFixed(1) : 0;

  document.getElementById("total").innerText = total;
  document.getElementById("wins").innerText = wins;
  document.getElementById("losses").innerText = losses;
  document.getElementById("winrate").innerText = winrate + "%";
}
</script>

</body>
</html>
